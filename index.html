<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Livro digital</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
</head>
<body>
    <div class="header">
        <h1>Meu Livro Digital</h1>
        <input type="file" id="pdf-upload" accept="application/pdf" />
        
        <div id="controls" class="controls" style="display: none;">
            <div class="zoom-controls">
                <button id="zoom-out">🔍 Zoom -</button>
                <button id="zoom-in">🔍 Zoom +</button>
            </div>
            
            <div class="page-selector">
                <label for="page-input">Página:</label>
                <input type="number" id="page-input" min="1" value="1">
                <span id="total-pages">/ 0</span>
                <button id="go-to-page">Ir</button>
            </div>
        </div>

        <div id="loading" style="display: none;">Processando páginas, aguarde...</div>
    </div>

    <div class="zoom-wrapper">
        <div class="book-container">
            <div id="flipbook"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
